$wallpapers = /home/$$/images/wallpaper/

background {
    monitor =
    path = $wallpapers/lights.jpg
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

shape {
    monitor =
    size = 360, 260
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    border_size = 0
    position = -200, 100
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = Log in
    color = rgba(240, 230, 220, 1.0)
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = -200, 150
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(121, 121, 121, 1.0)
    font_color = rgba(25, 20, 20, 1.0)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    rounding = 20
    position = -200, 42
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 360, 160
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 360, 260
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = 200, 100
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 320
    color = rgba(35, 31, 31, 0.8)
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    zindex = 10
}



# Media Info
## Music Card
image {
   monitor =
   path = /tmp/fishstick/artCover.png
   size = 72
   border_size = 1
   color = rgba(0, 0, 0, 0.5) # Semi-transparent black
   position = 200, 16
   halign = center
   rounding = 4
   valign = center
   zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] title=$(playerctl metadata xesam:title 2>/dev/null | cut -c1-24); if [ -z "$title" ]; then echo "No Music Playing"; else echo "$title"; fi
    color = rgba(240, 230, 220, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, -40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] artist=$(playerctl metadata xesam:artist 2>/dev/null | cut -c1-30); if [ -z "$artist" ]; then echo ""; else echo "$artist"; fi
    color = rgba(185, 175, 165, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -60
    halign = center
    valign = center
    zindex = 11
}

# Connectivity Buttons
shape {
    monitor =
    size = 150, 75
    color = rgba(204, 164, 124, 1.0)
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b> 
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] wifi=$(iw dev 2>/dev/null | awk '$1=="ssid"{print $2}' | head -n 1 | cut -c1-14); if [ -z "$wifi" ]; then echo "Disconnected"; else echo "$wifi"; fi
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = rgba(204, 164, 124, 1.0)
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b> 
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 290, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] bt=$(bluetoothctl info 2>/dev/null | grep "Name:" | cut -d ' ' -f 2- | cut -c 1-14); if [ -z "$bt" ]; then echo "Disconnected"; else echo "$bt"; fi
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = rgba(121, 121, 121, 1.0)
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

shape {
    monitor =
    size = 100, 20
    color = rgba(25, 20, 20, 1.0)
    rounding = 5
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo " <b>!</b> "; else echo " <b>󰚥</b> "; fi
    color = rgba(121, 121, 121, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -205
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/capacity | sed 's/.*/<b>&%<\/b>/'
    color = rgba(25, 20, 20, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/status
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}